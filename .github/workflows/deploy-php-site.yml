
name: Deploy PHP Website to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'menha-web-php/**'

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Path on the server where you want to deploy the files
          # Usually public_html for the main domain or public_html/subdomain for subdomains
          server-dir: ./public_html/
          # Local directory to upload (the PHP app folder)
          local-dir: ./menha-web-php/
          # Provide the strict deployment mode to delete files not present in the new version
          dangerous-clean-slate: false
