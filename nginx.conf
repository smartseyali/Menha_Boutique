
server {
    listen 80;
    server_name menhaboutique.com www.menhaboutique.com;

    # Root directory for the Admin Frontend (Vite App)
    # Update this path to where your 'dist' folder is located on the server
    root /var/www/menhaboutique/admin/dist;
    index index.html;

    # Serve Static Assets & SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Pass real client IP to backend
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve Uploaded Assets (Images) from Backend
    location /assets/ {
        proxy_pass http://localhost:5000/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Optional: Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
